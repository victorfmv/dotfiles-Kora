# Inactividad de Hyprland Kora: bloquea a los 10 min, apaga pantalla a los 12
general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr-kora/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
