# Pantalla de bloqueo de Hyprland Kora (Super+L)
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    font_size = 90
    font_family = JetBrains Mono NF
    color = rgb(e1754b)
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(e1754b)
    inner_color = rgba(20, 17, 15, 0.8)
    font_color = rgb(ebded5)
    check_color = rgb(ac512c)
    fail_color = rgb(f2c14e)
    placeholder_text = Contraseña
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}
