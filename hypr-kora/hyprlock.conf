# Pantalla de bloqueo de Hyprland Kora (Super+L)
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    font_size = 90
    font_family = JetBrains Mono NF
    color = rgb(91bfa8)
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(91bfa8)
    inner_color = rgba(17, 18, 17, 0.8)
    font_color = rgb(dde3dd)
    check_color = rgb(639a7e)
    fail_color = rgb(e06c5a)
    placeholder_text = Contraseña
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}
