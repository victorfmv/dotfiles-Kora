# Lanzador del modo Familiar: burbuja de vidrio estilo Apple (transparente, borde de luz fino,
# muy redondo). Hereda todo de fuzzel.ini y solo cambia colores y bordes. Los colores del tema
# los cambia tema.py igual que en fuzzel.ini; el blanco del borde se queda blanco.
include=~/.config/hypr-kora/fuzzel/fuzzel.ini

[colors]
background=120f14bb
border=ffffff66
selection=ffffff1f
selection-text=ebd6f7ff

[border]
radius=30
width=1
selection-radius=16
