# Fuzzel de Hyprland Kora (lanzador y menús). No toca ~/.config/fuzzel.
font=Rubik:size=14,CaskaydiaCove Nerd Font:size=14
terminal=kitty -e
prompt="󰍉   "
placeholder="Buscar apps…"
icon-theme=breeze-dark
layer=overlay
lines=8
width=34
line-height=34
inner-pad=14
horizontal-pad=22
vertical-pad=20
image-size-ratio=0.5
match-counter=no

[colors]
background=0e1115d0
text=aab6ccff
prompt=e44b43ff
placeholder=525c6eff
input=d4e2f9ff
match=e44b43ff
selection=e44b4326
selection-text=d4e2f9ff
selection-match=f4736cff
border=e44b4366

[border]
radius=22
width=2
selection-radius=12
