# Fuzzel de Hyprland Kora (lanzador y menús). No toca ~/.config/fuzzel.
font=Rubik:size=14,CaskaydiaCove Nerd Font:size=14
terminal=kitty -e
prompt="󰍉   "
placeholder="Buscar apps…"
icon-theme=breeze-dark
layer=overlay
lines=8
width=34
line-height=34
inner-pad=14
horizontal-pad=22
vertical-pad=20
image-size-ratio=0.5
match-counter=no

[colors]
background=14120fd0
text=c9bfadff
prompt=e6b450ff
placeholder=6b6255ff
input=f5ebd8ff
match=e6b450ff
selection=e6b45026
selection-text=f5ebd8ff
selection-match=f5cf7aff
border=e6b45066

[border]
radius=22
width=2
selection-radius=12
