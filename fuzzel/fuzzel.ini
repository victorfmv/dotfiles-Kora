# Fuzzel de Hyprland Kora (lanzador y menús). No toca ~/.config/fuzzel.
font=Rubik:size=14,CaskaydiaCove Nerd Font:size=14
terminal=kitty -e
prompt="󰍉   "
placeholder="Buscar apps…"
icon-theme=breeze-dark
layer=overlay
lines=8
width=34
line-height=34
inner-pad=14
horizontal-pad=22
vertical-pad=20
image-size-ratio=0.5
match-counter=no

[colors]
background=111211d0
text=b8beb8ff
prompt=91bfa8ff
placeholder=5d635dff
input=e3eae3ff
match=91bfa8ff
selection=91bfa826
selection-text=e3eae3ff
selection-match=b3d6c4ff
border=91bfa866

[border]
radius=22
width=2
selection-radius=12
