# Fuzzel de Hyprland Kora (lanzador y menús). No toca ~/.config/fuzzel.
font=Rubik:size=14,CaskaydiaCove Nerd Font:size=14
terminal=kitty -e
prompt="󰍉   "
placeholder="Buscar apps…"
icon-theme=breeze-dark
layer=overlay
lines=8
width=34
line-height=34
inner-pad=14
horizontal-pad=22
vertical-pad=20
image-size-ratio=0.5
match-counter=no

[colors]
background=0f1114d0
text=acbbcaff
prompt=65b4e5ff
placeholder=54606cff
input=d7e6f6ff
match=65b4e5ff
selection=65b4e526
selection-text=d7e6f6ff
selection-match=90cdf4ff
border=65b4e566

[border]
radius=22
width=2
selection-radius=12
